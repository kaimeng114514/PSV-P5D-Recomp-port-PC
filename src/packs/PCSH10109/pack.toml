# MaiDump copies (the legacy dumper's format): its eboot.bin is the same game code with a 152-byte mai loader stub
# appended and 8 patched bytes (the stub loads mai_moe/mai.suprx and the _m modules), so the segments that matter are
# byte-identical: the data segment matches 1.00's exactly and the code segment differs only in those 8 bytes, none at
# a hooked address. The 1.00 hooks therefore fit a MaiDump copy too; importing one used to be refused as "another
# version or region, or a modified dump (MaiDump's eboot loads its _m modules)". This is what a homebrew-dumped
# PCSH10109 on a Vita usually is (confirmed against the user's own desktop backup, 2026-11-06).
[versions."1.00-mai"]
sha256 = "1aae5b4bf4ed5677eba28014df8b2c507731885cf3c51e45c9cb789097cd8ec4"
status = "supported"
