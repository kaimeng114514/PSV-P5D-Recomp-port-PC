NAME = "Persona 5 Dancing in Starlight"
# BUILD_MINIMAL: the port plays as the minimal host -- the game's own runtime without Nativ's overlay menu, ImGui,
# settings UI and toasts (runtime/ui/overlay_min.cpp). The full build's overlay is the "Nativ" screen a player would
# otherwise meet first, and it captures the mouse (mouse_look), while this port's keyboard/mouse menu layer needs the
# cursor free; the control adaptation was developed and verified against the minimal host.
BUILD_MINIMAL = "1"
REGION = "Asia"
SPLIT = 16
MODULES = "libc libfios2 libface libsmart libult libgxm_es4 libgpu_es4"
TEST_FRAMES = 600
TEST_TOLERANCE = 8

